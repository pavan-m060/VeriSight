<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VeriSight</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon">🛡️</div>

                <div>
                    <div class="logo-text">VERISIGHT</div>
                    <div class="logo-subtitle">
                        AI & SPAM REVIEW ANALYSER
                    </div>
                </div>
            </div>
        </div>


        <!-- SCAN BUTTON -->
        <div class="scan-section">

            <button id="scanButton" class="scan-button">
                🔍 SCAN CURRENT PAGE
            </button>

            <div id="status" class="status">
                Ready to scan
            </div>

        </div>


        <!-- RESULTS -->
        <div id="results"></div>

    </div>


    <script src="sidepanel.js"></script>

</body>
</html>
